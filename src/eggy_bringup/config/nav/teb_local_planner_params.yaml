# TEB local planner parameters for the mecanum base.
TebLocalPlannerROS:

  odom_topic: /odom
  map_frame: map

  # 30 cm x 20 cm rectangular chassis.
  footprint_model:
    type: "polygon"
    vertices: [[-0.15, -0.10], [-0.15, 0.10], [0.15, 0.10], [0.15, -0.10]]

  # max_vel_y > 0 and weight_kinematics_nh = 0 enable holonomic trajectories.
  min_turning_radius: 0.0
  wheelbase: 0.25
  cmd_angle_instead_rotvel: false

  # Conservative exploration limits for the current STM32 base driver.
  max_vel_x: 0.25
  max_vel_x_backwards: 0.25
  max_vel_y: 0.20
  max_vel_trans: 0.25
  min_vel_trans: 0.01
  max_vel_theta: 0.80
  min_vel_theta: 0.05

  # --- 加速度限制 ---
  acc_lim_x: 0.6
  acc_lim_y: 0.6
  acc_lim_theta: 1.2

  # --- 轨迹优化 ---
  dt_ref: 0.30
  dt_hysteresis: 0.08
  teb_autosize: true
  global_plan_overwrite_orientation: true
  allow_init_with_backwards_motion: false
  max_global_plan_lookahead_dist: 2.2
  global_plan_viapoint_sep: 0.20
  max_samples: 500
  no_inner_iterations: 4
  no_outer_iterations: 3
  optimization_activate: true
  optimization_verbose: false

  # --- 目标容差 ---
  xy_goal_tolerance: 0.18
  yaw_goal_tolerance: 0.60
  free_goal_vel: true

  # --- 障碍物 ---
  min_obstacle_dist: 0.18
  inflation_dist: 0.32
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.2
  obstacle_poses_affected: 30

  # --- 可行性检查 ---
  feasibility_check_no_poses: 2

  # --- 权重 ---
  weight_kinematics_nh: 0.0
  weight_kinematics_forward_drive: 0.0
  weight_max_vel_y: 2.0
  weight_acc_lim_y: 1.0
  weight_kinematics_turning_radius: 0.0
  weight_optimaltime: 1.5
  weight_shortest_path: 10.0
  weight_obstacle: 60.0
  weight_inflation: 0.6
  weight_dynamic_obstacle: 10.0
  weight_velocity_obstacle: 10.0
  weight_acceleration_obstacle: 10.0
  weight_parallelity: 5.0
  weight_custom_obstacle: 10.0
  weight_viapoint: 30.0

  # --- 其它 ---
  enable_homotopy_class_planning: false
  enable_multiple_start_poses: false
  exact_arc_length: false
  shrink_horizon_backup: true
  shrink_horizon_min_duration: 8.0
  penalty_epsilon: 0.05

  # --- 振荡恢复 ---
  oscillation_recovery: true
  oscillation_v_eps: 0.12
  oscillation_omega_eps: 0.12
  oscillation_recovery_min_duration: 6.0
  oscillation_filter_duration: 4.0
