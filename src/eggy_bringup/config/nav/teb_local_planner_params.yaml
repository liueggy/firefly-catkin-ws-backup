# TEB 局部规划器参数 — 调优版：更连贯、更顺滑
TebLocalPlannerROS:

  # --- 机器人配置 ---
  odom_topic: /odom
  map_frame: /odom

  # --- 运动学限制（提高加速能力） ---
  max_vel_x: 0.40
  max_vel_y: 0.30
  max_vel_trans: 0.40
  min_vel_trans: 0.03
  max_vel_theta: 1.00
  min_vel_theta: 0.08

  acc_lim_x: 1.0           # 翻倍，起步更快
  acc_lim_y: 0.8           # 横移加速翻倍
  acc_lim_theta: 2.0       # 转弯加速更快

  # --- 全向模式（麦轮必须） ---
  holonomic_robot: true

  # --- 轨迹优化参数 ---
  min_turning_radius: 0.0
  wheelbase: 0.25
  cmd_angle_instead_rotvel: false

  # --- 前向模拟（调细时序，轨迹更平滑） ---
  dt_ref: 0.20             # 0.35→0.20，轨迹点更密
  dt_hysteresis: 0.05      # 缩小滞后，保持稳定
  global_plan_overwrite_orientation: true
  allow_init_with_backwards_motion: false
  max_global_plan_lookahead_dist: 3.5   # 2.0→3.5，看得更远，减少空窗
  global_plan_viapoint_sep: -1.0

  # --- 目标容差 ---
  xy_goal_tolerance: 0.10
  yaw_goal_tolerance: 0.15
  free_goal_vel: false

  # --- 障碍物（收紧一点，减少绕路） ---
  min_obstacle_dist: 0.20
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.0
  obstacle_poses_affected: 30
  inflation_dist: 0.30

  # --- 优化权重（加快速度权重，降低不必要的绕行） ---
  weight_kinematics_forward_drive: 1.0
  weight_kinematics_turning_radius: 1.0
  weight_optimaltime: 5.0            # 3.0→5.0，更积极追求速度
  weight_shortest_path: 1.0
  weight_obstacle: 40.0              # 50→40，略微放松避障，减少S型
  weight_inflation: 0.2
  weight_dynamic_obstacle: 10.0
  weight_velocity_obstacle: 10.0
  weight_acceleration_obstacle: 10.0
  weight_parallelity: 5.0
  weight_custom_obstacle: 10.0

  # --- 其它 ---
  enable_homotopy_class_planning: true
  enable_multiple_start_poses: false
  exact_arc_length: false
  shrink_horizon_backup: true
  shrink_horizon_min_duration: 10.0
  visualize_hc_graph: false

  # --- 恢复行为（缩短震荡过滤时间） ---
  oscillation_recovery: true
  oscillation_v_eps: 0.1
  oscillation_omega_eps: 0.1
  oscillation_recovery_min_duration: 5.0   # 10→5，卡死后更快恢复
  oscillation_filter_duration: 3.0         # 10→3，震荡过滤缩短
