# TEB local planner parameters — constrained omnidirectional mecanum profile.
# Lateral motion continuously removes cross-track error, but remains bounded
# below half the forward speed to avoid diagonal surges and heading oscillation.
TebLocalPlannerROS:

  odom_topic: /odom
  map_frame: map

  # 30 cm x 20 cm rectangular chassis.
  footprint_model:
    type: "polygon"
    vertices: [[-0.15, -0.10], [-0.15, 0.10], [0.15, 0.10], [0.15, -0.10]]

  min_turning_radius: 0.0
  wheelbase: 0.25
  cmd_angle_instead_rotvel: false

  # Velocity limits: forward travel remains dominant; lateral motion is a
  # continuous correction channel instead of an occasional low-speed trim.
  max_vel_x: 0.27
  max_vel_x_backwards: 0.10
  max_vel_y: 0.12
  max_vel_trans: 0.30
  min_vel_trans: 0.01
  max_vel_theta: 0.62
  min_vel_theta: 0.08

  # --- 加速度限制 ---
  acc_lim_x: 0.45
  acc_lim_y: 0.28
  acc_lim_theta: 0.85

  # --- 轨迹优化 ---
  dt_ref: 0.25
  dt_hysteresis: 0.06
  teb_autosize: true
  # Preserve the commanded chassis heading along the path so mecanum lateral
  # correction does not repeatedly become rotate-then-drive motion.
  global_plan_overwrite_orientation: false
  allow_init_with_backwards_motion: false
  max_global_plan_lookahead_dist: 2.2
  global_plan_viapoint_sep: 0.45
  max_samples: 500
  no_inner_iterations: 4
  no_outer_iterations: 3
  optimization_activate: true
  optimization_verbose: false

  # --- 目标容差：位置准 + 朝向准 ---
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.15
  free_goal_vel: false

  # --- 障碍物 ---
  min_obstacle_dist: 0.12
  inflation_dist: 0.22
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.2
  obstacle_poses_affected: 30

  # --- 可行性检查 ---
  feasibility_check_no_poses: 2

  # --- 权重：全向模型，前进优先，横移在边界内平滑修正 ---
  weight_kinematics_nh: 0.0
  weight_kinematics_forward_drive: 12.0
  weight_max_vel_y: 2.0
  weight_acc_lim_y: 1.0
  weight_kinematics_turning_radius: 0.0
  weight_optimaltime: 1.5
  weight_shortest_path: 10.0
  weight_obstacle: 60.0
  weight_inflation: 0.6
  weight_dynamic_obstacle: 10.0
  weight_velocity_obstacle: 10.0
  weight_acceleration_obstacle: 10.0
  weight_parallelity: 5.0
  weight_custom_obstacle: 10.0
  weight_viapoint: 8.0

  # --- 其它 ---
  enable_homotopy_class_planning: false
  enable_multiple_start_poses: false
  exact_arc_length: false
  shrink_horizon_backup: true
  shrink_horizon_min_duration: 2.5
  penalty_epsilon: 0.05

  # --- 振荡恢复 ---
  oscillation_recovery: true
  oscillation_v_eps: 0.05
  oscillation_omega_eps: 0.08
  oscillation_recovery_min_duration: 2.0
  oscillation_filter_duration: 2.0
