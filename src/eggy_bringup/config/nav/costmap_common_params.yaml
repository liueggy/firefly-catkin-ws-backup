# Costmap common parameters — shared by global and local costmaps
obstacle_range: 3.5
raytrace_range: 5.5
# 小车实际尺寸：长30cm(x方向) × 宽20cm(y方向)，以 base_link 为中心
footprint: [[-0.15, -0.10], [-0.15, 0.10], [0.15, 0.10], [0.15, -0.10]]
robot_base_frame: base_link

plugins:
- {name: obstacle_layer, type: "costmap_2d::VoxelLayer"}
- {name: inflation_layer, type: "costmap_2d::InflationLayer"}

obstacle_layer:
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    sensor_frame: laser_frame
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true
    max_obstacle_height: 2.0
    min_obstacle_height: 0.05

inflation_layer:
  # Narrow-passage profile: keep a smaller safety halo so corridors are not
  # marked blocked before TEB has a chance to optimize through them.
  inflation_radius: 0.22
  cost_scaling_factor: 8.0
  inflate_unknown: false
