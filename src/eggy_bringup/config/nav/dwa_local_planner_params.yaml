# DWA 局部规划器参数：导航优先“先转向，再直行”，减少车头摆动
DWAPlannerROS:
  max_vel_x: 0.20
  min_vel_x: 0.00
  max_vel_y: 0.00
  min_vel_y: 0.00
  max_vel_trans: 0.20
  min_vel_trans: 0.03
  max_vel_theta: 0.65
  min_vel_theta: 0.08

  acc_lim_x: 0.35
  acc_lim_y: 0.0
  acc_lim_theta: 0.9

  xy_goal_tolerance: 0.12
  yaw_goal_tolerance: 0.20
  latch_xy_goal_tolerance: true

  sim_time: 2.5
  sim_granularity: 0.05
  vx_samples: 8
  vy_samples: 1
  vtheta_samples: 24

  path_distance_bias: 36.0
  goal_distance_bias: 18.0
  occdist_scale: 0.08
  forward_point_distance: 0.35
  stop_time_buffer: 0.3
  scaling_speed: 0.20
  max_scaling_factor: 0.25

  holonomic_robot: false
  penalize_negative_x: true
  prune_plan: true
